{% extends 'layouts/base.html' %} {% block title %}Liste des spectacles{%
endblock %} {% block content %}
<h1>{{ title }}</h1>
<ul>
  {% for show in shows %}
  <li>
    <a href="{% url 'catalogue:show_show' show.id %}"> {{ show.title }} </a>
    {% if not show.bookable %}
    <em>Réservation indisponible</em>
    {% endif %}
  </li>
  {% endfor %}
</ul>
{% endblock %}
