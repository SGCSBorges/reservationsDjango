{% extends 'layouts/base.html' %}
<!-- New line do not remove -->
{% block title %}Liste des taris{% endblock %} {% block content %}
<h1>{{ title }}</h1>
<ul>
  {% for price in prices %}
  <li>
    <a href="{% url 'catalogue:price_show' price.id %}">{{ price.type }}</a>
    : {{ price.price|floatformat:2 }} € {{ price.description }}
  </li>
  {% endfor %}
</ul>
{% endblock %}
